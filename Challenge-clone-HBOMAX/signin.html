<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;700&display=swap" rel="stylesheet">
    <title>Entrar | HBO Max</title>
    <style>
        body {
            background-image: url(assets/images/background-movies-series.png);
            background-size: cover;
            background-position: center;
            height: 100vh;
        }

        :root {
            --primary-color: #020228;
            --secondary-color: #ff00e5;
            --tertiary-color: #b535f6;
            --btn-bg-color-gradient: linear-gradient(45deg, #9b34ef 0%, #490cb0 20%, transparent 50%);
            --btn-link-bg-color: #fff;
            --btn-link-color: #000;
            --card-bg-color: linear-gradient(0deg, transparent, #3b1e63);
            --divider-bg-color: linear-gradient(90deg, #5516ba, rgba(255, 0, 229, 0.5) 80%);
            --nav-bg-color: rgba(0, 0, 0, 0.3);
            --text-color: #fff;
            --link-color: #9e86ff;
            --form-bg-color: rgba(211, 211, 211, 0.06);
            --form-field-bg-color: rgba(0, 0, 0, 0.2);
            --form-field-border: 1px solid rgba(255, 255, 255, 0.7);
            --form-field-placeholder: rgba(255, 255, 255, 0.7);
            --form-field-error: rgb(255, 76, 76);
            scroll-behavior: smooth;
        }

        /* Custom Scroll */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--tertiary-color);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }

        body {
            color: var(--text-color);
            background-color: var(--primary-color);
        }

        * {
            font-family: "Raleway", sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .menu-logo {
            max-width: 160px;
        }

        .menu-logo-image {
            width: 100%;
        }

        .menu {
            width: 100%;
            padding: 12px 16px;
            position: fixed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--nav-bg-color);
            z-index: 1;
            top: 0;
        }

        .menu-item {
            margin-right: 24px;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text-color);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .menu-item--button {
            padding: 8px 26px;
            transition: background 1s, color 1s;
        }

        .button {
            padding: 7px 25px;
            background-color: var(--tertiary-color);
            border-radius: 500px;
            font-weight: 700;
            color: var(--text-color);
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 4px;
            border: none;
            cursor: pointer;
        }

        .menu-item--button.button:hover {
            background-color: #fff;
            color: var(--primary-color);
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Quicksand", cursive;
            width: 100%;
            height: 70%;
            padding: 24px;
        }

        .login {
            width: 100%;
            max-width: 800px;
            background-color: var(--form-bg-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 40px;
        }

        .login-title {
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.25rem;
            margin-bottom: 24px;
        }

        .login-label {
            text-align: left;
        }

        .login-field {
            background: var(--form-field-bg-color);
            border: var(--form-field-border);
            border-radius: 8px;
            color: var(--text-color);
            padding: 16px;
            font-size: 1rem;
        }

        .login-actions {
            margin-top: 24px;
            text-align: left;
        }

        .button.button--gradient {
            background: var(--btn-bg-color-gradient);
            outline: 3px solid transparent;
            transition: background 1s, outline 1s, transform 1s;
            background-size: 250%;
        }

        .login-link {
            color: var(--link-color);
            text-decoration: none;
            margin-left: 24px;
            font-weight: bold;
        }

        .footer-link {
            font-family: "Raleway", sans-serif;
            font-weight: bold;
            color: var(--link-color);
            text-transform: uppercase;
            text-decoration: none;
            margin: 0 14px;
            letter-spacing: 2px;
            transition: color 0.5s;
            font-size: 0.875rem;
        }

        .footer-legal {
            font-size: 0.75rem;
            margin: 16px 0;
            color: var(--link-color);
        }

        .footer-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-top: 80px;
        }

        .container {
            margin: auto;
            padding: 24px;
            text-align: center;
        }

        .button--gradient:hover {
            background: linear-gradient(-45deg, #56125b, #0f0f10, #271e6e);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite alternate;
            color: #fff;
            border-color: #ff00e5;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>

<body>
    <nav class="menu">
        <a href="index.html" class="menu-logo">
            <img src="assets/images/hbo-logo.svg" alt="logotipo da HBO Max" class="menu-logo-image">
        </a>
        <div>
            <a href="signin.html" class="menu-item">Entrar</a>
            <a href="#subscription" class="menu-item menu-item--button button">Assine agora</a>
        </div>
    </nav>
    <main class="content">
        <form class="login container">
            <h1 class="login-title">Entrar</h1>
            <label class="login-label"> Você tem uma conta da HBO Max? </label>
            <input class="login-field" type="email" name="email" id="email" placeholder="Endereço de e-mail">
            <input class="login-field" type="password" name="password" id="password" placeholder="Senha" minlength="8">

            <div class="login-actions">
                <button type="submit" class="button button--gradient">Entrar</button>
                <a href="forgot-password.html" class="login-link"> Esqueceu a senha? </a>
            </div>
        </form>
    </main>
    <footer class="footer container">
        <div>
            <a class="footer-link" href="#">Agora na HBO Max</a>
            <a class="footer-link" href="#">Em breve</a>
            <a class="footer-link" href="#">Filme em destaque</a>
            <a class="footer-link" href="#">Séries</a>
            <a class="footer-link" href="#">Ajuda</a>
        </div>
        <p class="text--small footer-legal">
            © 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos
            reservados. HBO Max é usado sob licença.
        </p>
        <div class="footer-social">
            <a href="https://www.facebook.com/HBOMaxBr/" class="footer-social-link">
                <img src="assets/images/fb_0.png" alt="Página do Facebook da HBO Max">
            </a>
            <a href="https://twitter.com/HBOMaxBR" class="footer-social-link">
                <img src="assets/images/twitter_0.png" alt="Página do Twitter da HBO Max">
            </a>
            <a href="https://www.instagram.com/hbomaxbr/" class="footer-social-link">
                <img src="assets/images/instagram_0.png" alt="Página do Instagram da HBO Max">
            </a>
            <a href="https://www.youtube.com/c/hbomaxbr" class="footer-social-link">
                <img src="assets/images/youtube_0.png" alt="Página do YouTube da HBO Max">
            </a>
        </div>
    </footer>
</body>

</html>
