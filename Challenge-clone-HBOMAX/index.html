<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Projeto-do-iago/style.css">
    <title>Document</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;700&display=swap");

        :root {
            --primary-color: #020228;
            --secondary-color: #ff00e5;
            --tertiary-color: #b535f6;
            --btn-bg-color-gradient: linear-gradient(45deg,
                    #9b34ef 0%,
                    #490cb0 20%,
                    transparent 50%);
            --btn-link-bg-color: #fff;
            --btn-link-color: #000;
            --card-bg-color: linear-gradient(0deg, transparent, #3b1e63);
            --divider-bg-color: linear-gradient(90deg,
                    #5516ba,
                    rgba(255, 0, 229, 0.5) 80%);
            --nav-bg-color: rgba(0, 0, 0, 0.3);
            --text-color: #fff;
            --link-color: #9e86ff;
            --form-bg-color: rgba(211, 211, 211, 0.06);
            --form-field-bg-color: rgba(0, 0, 0, 0.2);
            --form-field-border: 1px solid rgba(255, 255, 255, 0.7);
            --form-field-placeholder: rgba(255, 255, 255, 0.7);
            --form-field-error: rgb(255, 76, 76);

            scroll-behavior: smooth;
        }

        /* Custom Scroll */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--tertiary-color);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }

        body {
            color: var(--text-color);
            background-color: var(--primary-color);
        }

        * {
            font-family: "Raleway", sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .menu-logo {
            max-width: 160px;

        }

        .menu {
            width: 100%;
            padding: 12px 16px;
            position: fixed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--nav-bg-color);
        }

        .menu-item {
            margin-right: 24px;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text-color);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .menu-item--button {
            padding: 8px 26px;
            transition: background 1s, color 1s;
        }

        .button {
            padding: 7px 25px;
            background-color: var(--tertiary-color);
            border-radius: 500px;
            font-weight: 700;
            color: var(--text-color);
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 4px;
            border: none;
            cursor: pointer;
        }

        .menu-item--button.button:hover {
            background-color: #fff;
            /* Cor de fundo branca ao passar o mouse */
            color: var(--primary-color);
            /* Cor do texto para contraste */
        }
    </style>
</head>

<body>
    <nav class="menu">
        <img src="/assets/images/hbo-logo.svg" alt="logo da HBO" class="menu-logo">
        <div>
            <a href="signin.html" class="menu-item">Entrar</a>
            <a href="subscription" class="menu-item menu-item--button button">Assine agora</a>

        </div>
    </nav>
    <header></header>
    <main></main>
    <footer></footer>
</body>

</html>
